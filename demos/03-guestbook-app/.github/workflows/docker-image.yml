# CI/CD example (shown in class, not run live).
# On every push to main: build the Docker image and push it to a registry
# (GitHub Container Registry here). This is the "circleCI" box in the
# "Workflow with Docker" slides (107-119), with GitHub Actions instead.
#
# Pushing to Docker Hub instead? Swap the login step for:
#   registry: docker.io, username: ${{ vars.DOCKERHUB_USERNAME }},
#   password: ${{ secrets.DOCKERHUB_TOKEN }}

name: Build and push Docker image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags the image with the branch name and the commit SHA
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
